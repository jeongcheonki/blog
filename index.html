<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>달력 앱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <button id="prevMonth" aria-label="이전 달">◀</button>
      <h1 id="monthLabel"></h1>
      <button id="nextMonth" aria-label="다음 달">▶</button>
    </header>

    <div class="sub-toolbar">
      <button id="todayButton">오늘로 이동</button>
      <button id="monthlyReviewButton">월말 모아보기</button>
    </div>

    <section class="calendar" aria-label="월간 달력">
      <div class="weekday">일</div>
      <div class="weekday">월</div>
      <div class="weekday">화</div>
      <div class="weekday">수</div>
      <div class="weekday">목</div>
      <div class="weekday">금</div>
      <div class="weekday">토</div>
      <div id="calendarDays" class="days"></div>
    </section>

    <section id="monthlyReviewPanel" class="review-panel hidden" aria-live="polite">
      <h2 id="reviewTitle">이번 달 칭찬 모아보기</h2>
      <ul id="reviewList"></ul>
    </section>

    <section class="month-total-panel" aria-live="polite">
      <strong id="monthMoodTotalLabel">이달 기분점수 총합: 0점</strong>
    </section>
  </main>

  <div id="entryModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
    <div class="modal-content">
      <h2 id="entryTitle">오늘의 나를 칭찬해요</h2>
      <p id="entryDateLabel" class="entry-date"></p>

      <label for="praiseInput">자기칭찬 한 줄</label>
      <textarea id="praiseInput" maxlength="120" placeholder="예: 피곤했지만 끝까지 해냈다."></textarea>

      <label for="moodInput">기분 점수 (1~5)</label>
      <select id="moodInput">
        <option value="1">1점</option>
        <option value="2">2점</option>
        <option value="3">3점</option>
        <option value="4">4점</option>
        <option value="5">5점</option>
      </select>

      <div class="modal-actions">
        <button id="deleteEntryButton" type="button">기록 지우기</button>
        <button id="closeModalButton" type="button">취소</button>
        <button id="saveEntryButton" type="button">저장</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
